name: blurby

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - blurby-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    shm_size: 256mb

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    # Laptop and office LAN use host port 18469. The Compose service is named
    # odoo and listens on 8069, which is where tunnel "hagen-odoo" sends
    # https://erp.hagenbikes.com (http://odoo:8069).
    ports:
      - "0.0.0.0:18469:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
      BLURBY_ADMIN_PASSWORD: ${BLURBY_ADMIN_PASSWORD:-}
      HAGEN_EMPLOYEE_PASSWORD: ${HAGEN_EMPLOYEE_PASSWORD:-}
      BLURBY_WC_KEY: ${BLURBY_WC_KEY:-}
      BLURBY_WC_SECRET: ${BLURBY_WC_SECRET:-}
      BLURBY_HU_WC_KEY: ${BLURBY_HU_WC_KEY:-}
      BLURBY_HU_WC_SECRET: ${BLURBY_HU_WC_SECRET:-}
      HAGEN_WC_KEY: ${HAGEN_WC_KEY:-}
      HAGEN_WC_SECRET: ${HAGEN_WC_SECRET:-}
      RATTAPROFF_WP_USER: ${RATTAPROFF_WP_USER:-}
      RATTAPROFF_APP_PASSWORD: ${RATTAPROFF_APP_PASSWORD:-}
    volumes:
      - blurby-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons
      - ./scripts:/opt/blurby:ro
      - ./data:/opt/hagen-data:ro
    restart: unless-stopped

  # Named tunnel "hagen-odoo": https://erp.hagenbikes.com -> http://odoo:8069.
  # Started only with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - odoo
    restart: unless-stopped

volumes:
  blurby-db:
  blurby-data:
